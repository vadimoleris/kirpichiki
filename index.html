<title>Кирпичики</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141414">
<link rel="icon" href="icon-192.png">
<style>
:root { --bg:#faf7f0; --fg:#1c1a17; --mut:#8a8378; --acc:#b3402a; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#141414; --fg:#e9e4d8; --mut:#7d786e; --acc:#d06a4f; }
}
* { box-sizing:border-box; }
body { margin:0; height:100dvh; background:var(--bg); color:var(--fg);
  display:flex; flex-direction:column; font-family:system-ui,sans-serif; }
header { display:flex; gap:.5rem; padding:.6rem .8rem; overflow-x:auto; }
header button { border:1px solid var(--mut); background:none; color:var(--fg);
  border-radius:999px; padding:.4rem .9rem; font-size:.95rem; white-space:nowrap; cursor:pointer; }
header button.on { border-color:var(--acc); color:var(--acc); font-weight:600; }
main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:0 1rem; user-select:none; }
.cjk { font-family:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
#glyph { line-height:1.15; }
#meaning { font-size:1.35rem; margin-top:1.2rem; max-width:34rem; }
#sub { color:var(--mut); margin-top:.8rem; font-size:1rem; line-height:1.8; }
#sub .cjk { font-size:1.3rem; }
footer { display:flex; align-items:center; justify-content:space-between; padding:.6rem 1rem 1rem; }
footer button { font-size:1.6rem; width:4rem; height:3.2rem; border:1px solid var(--mut);
  background:none; color:var(--fg); border-radius:.8rem; cursor:pointer; }
#count { color:var(--mut); font-variant-numeric:tabular-nums; }
</style>
</head>

  <span id="count"></span>
  <button id="next" aria-label="Вперёд">→</button>

let d = Math.min(+localStorage.getItem("k.deck") || 0, DECKS.length - 1);
let pos = JSON.parse(localStorage.getItem("k.pos") || "{}");
let i = pos[d] || 0;
const $ = id => document.getElementById(id);

function menu() {
  $("menu").innerHTML = "";
  DECKS.forEach((deck, k) => {
    const b = document.createElement("button");
    b.textContent = deck.name;
    if (k === d) b.className = "on";
    b.onclick = () => { d = k; i = pos[d] || 0; show(); };
    $("menu").appendChild(b);
  });
}

function show() {
  const cards = DECKS[d].cards, n = cards.length;
  i = ((i % n) + n) % n;
  const card = cards[i];
  $("glyph").textContent = card.c;
  $("glyph").style.fontSize =
    card.c.length === 1 ? "40vmin" : card.c.length === 2 ? "24vmin" : "16vmin";
  $("meaning").textContent = card.m;
  let sub = "";
  if (card.s) sub += 'самостоятельно: <span class="cjk">' + card.s + "</span>";
  if (card.x) sub += (sub ? "<br>" : "") + 'внутри: <span class="cjk">' + card.x + "</span>";
  $("sub").innerHTML = sub;
  $("count").textContent = (i + 1) + " / " + n;
  pos[d] = i;
  localStorage.setItem("k.pos", JSON.stringify(pos));
  localStorage.setItem("k.deck", d);
  menu();
}

const step = k => { i += k; show(); };
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
  const k = +e.key - 1;
  if (k >= 0 && k < DECKS.length) { d = k; i = pos[d] || 0; show(); }
});
let tx = 0, ty = 0;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
});
show();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
